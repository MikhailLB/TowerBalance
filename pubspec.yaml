name: tower_balance
description: "TowerBalance - balance the falling blocks and build the tallest tower!"
publish_to: 'none'
version: 1.0.0+1 # Marketing + build: synced to iOS/Android via Flutter tooling


environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  flame_forge2d: ^0.19.2+6
  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  audioplayers: ^6.6.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.webp
    - assets/logo_name.webp
    - assets/gameplay_assets/
    - assets/additional_assets/loading_screen/
    - assets/additional_assets/notifications/
    - assets/additional_assets/no_wifi/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#87CEEB"
  adaptive_icon_background: "#87CEEB"
  adaptive_icon_foreground: "assets/logo.png"
